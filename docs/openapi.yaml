openapi: 3.1.0

info:
  title: Creon API
  version: 0.1.0
  description: |
    Backend API for **Creon** — a Web3 crowdfunding (urun dana) platform for
    Indonesian UMKM on Stellar/Soroban.

    ## Authentication
    All protected endpoints require a JWT bearer token obtained via
    `POST /auth/login` or `POST /auth/register`.

    ### Wallet challenge-response flow
    1. `POST /auth/challenge` → receive a nonce message
    2. Sign the message with your Stellar secret key (Ed25519)
    3. `POST /auth/register` (first time) or `POST /auth/login` with the signature

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: auth
    description: Wallet-based challenge-response authentication
  - name: kyc
    description: KYC submission and status (entrepreneurs and investors)
  - name: admin
    description: Admin review queues — KYC and funding proposals
  - name: proposals
    description: Entrepreneur funding proposals (off-chain draft → submit)
  - name: campaigns
    description: Public browsing of live campaigns (list + detail)
  - name: holdings
    description: |
      Current share-token ownership, maintained off-chain by the ownership indexer
      (polls `ShareToken` events, then writes a fresh on-chain `balance()` read into
      `TokenHolding`). Two views: an investor's own portfolio, and a campaign's
      public — but identity-masked — cap table.
  - name: investments
    description: |
      Investor funding of a live campaign in USDC.

      ### Signing flow (backend prepares, investor signs, backend submits)
      The on-chain `invest(investor, amount)` requires the investor's own
      authorization (and pulls their USDC), so the investor must sign — the
      platform key cannot invest on their behalf. The flow is:
      1. `POST /campaigns/{campaignId}/investments/prepare` → backend builds &
         simulates the `invest()` tx **with the investor as source** and returns
         the unsigned XDR.
      2. The investor signs the XDR with their wallet (e.g. Freighter).
      3. `POST /campaigns/{campaignId}/investments` → backend verifies the signed
         tx, wraps it in a **platform fee-bump** (so the investor pays no XLM
         fee), submits it, and records the `Investment`.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Enums ──────────────────────────────────────────────────────────────────
    KycStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, REVOKED]
      description: |
        - `PENDING` – awaiting admin review
        - `APPROVED` – identity verified; the wallet is enqueued for the on-chain whitelist (`registry.add`)
        - `REJECTED` – rejected; user may resubmit
        - `REVOKED` – a previously-approved KYC was revoked (expiry/sanction); the wallet is removed from the on-chain whitelist (`registry.remove`)

    Role:
      type: string
      enum: [ENTREPRENEUR, INVESTOR, ADMIN]

    ProposalStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]
      description: |
        - `DRAFT` – created, editable, not yet submitted
        - `SUBMITTED` – submitted, awaiting admin review
        - `UNDER_REVIEW` – an admin is reviewing the proposal
        - `APPROVED` – approved by an admin; creates the campaign mirror and enqueues its on-chain deploy
        - `REJECTED` – rejected by an admin

    CampaignStatus:
      type: string
      enum: [PENDING_DEPLOYMENT, ACTIVE, LOCKED, GOAL_REACHED, COMPLETED, CANCELLED]
      description: |
        - `PENDING_DEPLOYMENT` – campaign mirror created; on-chain contracts not yet live
        - `ACTIVE` – contracts live and open for investment (funding)
        - `LOCKED` – capital locked (principal + share transfer)
        - `GOAL_REACHED` – funding goal met
        - `COMPLETED` – campaign settled
        - `CANCELLED` – campaign cancelled

    InvestmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, FAILED]
      description: |
        - `PENDING` – recorded but not yet confirmed on-chain
        - `CONFIRMED` – the `invest()` tx succeeded on-chain and shares were minted
        - `FAILED` – the investment did not complete

    # ── Request bodies ─────────────────────────────────────────────────────────
    ChallengeRequest:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
          description: Stellar public key (G…, 56 characters)
          example: GAHJJJKMOKYE4RVPZEWZTKH5FVI4PA3VL7GK2LFNUBSGBV3MV72CSOFA

    RegisterRequest:
      type: object
      required: [walletAddress, signature, role]
      properties:
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
          description: Stellar public key (G…, 56 characters)
          example: GAHJJJKMOKYE4RVPZEWZTKH5FVI4PA3VL7GK2LFNUBSGBV3MV72CSOFA
        signature:
          type: string
          description: Base64-encoded Ed25519 signature over the challenge message
        role:
          type: string
          enum: [ENTREPRENEUR, INVESTOR]
          description: Self-assignable role for the new account
        email:
          type: string
          format: email
          description: Required when `role` is `ENTREPRENEUR`; optional for investors
          example: founder@umkm.id
        displayName:
          type: string
          description: Optional display name
          example: Budi Santoso

    LoginRequest:
      type: object
      required: [walletAddress, signature]
      properties:
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
          example: GAHJJJKMOKYE4RVPZEWZTKH5FVI4PA3VL7GK2LFNUBSGBV3MV72CSOFA
        signature:
          type: string
          description: Base64-encoded Ed25519 signature over the challenge message

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Reason shown to the entrepreneur for re-submission
          example: NIK tidak dapat diverifikasi, mohon upload ulang KTP yang jelas.

    RevokeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the previously-approved KYC is being revoked (expiry/sanction)
          example: Wallet flagged on sanctions screening.

    CreateProposalRequest:
      type: object
      required:
        - businessName
        - businessDescription
        - category
        - requestedAmount
        - lockPeriodDays
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 255
          example: Warung Kopi Nusantara
        businessDescription:
          type: string
          minLength: 1
          maxLength: 5000
          example: Ekspansi gerai kopi UMKM di Yogyakarta dengan modal urun dana.
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: Kuliner
        location:
          type: string
          minLength: 1
          maxLength: 255
          example: Yogyakarta
        requestedAmount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: Requested funding amount as a decimal string (up to 7 decimals, must be > 0)
          example: "10000.0000000"
        lockPeriodDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: Capital lock period in days
          example: 180

    UpdateProposalRequest:
      type: object
      description: Partial update of a DRAFT proposal; every field is optional.
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 255
          example: Warung Kopi Nusantara
        businessDescription:
          type: string
          minLength: 1
          maxLength: 5000
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: Kuliner
        location:
          type: string
          minLength: 1
          maxLength: 255
          example: Yogyakarta
        requestedAmount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: Requested funding amount as a decimal string (up to 7 decimals, must be > 0)
          example: "12500.0000000"
        lockPeriodDays:
          type: integer
          minimum: 1
          maximum: 3650
          example: 180

    PrepareInvestmentRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: USDC amount to invest as a decimal string (up to 7 decimals, must be > 0)
          example: "500.0000000"

    SubmitInvestmentRequest:
      type: object
      required: [signedXdr]
      properties:
        signedXdr:
          type: string
          description: |
            Base64 XDR of the investor-signed `invest()` transaction envelope
            (the XDR returned by the `prepare` endpoint, signed by the wallet).
          example: AAAAAgAAAAA...

    # ── Responses ──────────────────────────────────────────────────────────────
    ChallengeResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Nonce string to sign with the Stellar secret key
          example: "Sign this message to authenticate with Creon: a3f8c1d2e9b7"

    TokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: JWT bearer token; payload contains `sub` (userId) and `roles`

    KycSubmitResponse:
      type: object
      required: [status, submittedAt]
      properties:
        status:
          $ref: '#/components/schemas/KycStatus'
        submittedAt:
          type: string
          format: date-time

    KycProfile:
      type: object
      required: [status, fullName, nationalId, submittedAt]
      properties:
        status:
          $ref: '#/components/schemas/KycStatus'
        fullName:
          type: string
          example: Budi Santoso
        nationalId:
          type: string
          description: Indonesian NIK (16 digits)
          example: "3271010101900001"
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        rejectionReason:
          type: [string, 'null']
          example: Foto selfie tidak jelas.

    AdminKycItem:
      type: object
      required:
        - userId
        - walletAddress
        - email
        - roles
        - fullName
        - nationalId
        - status
        - submittedAt
        - idCardUrl
      properties:
        userId:
          type: string
          format: uuid
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Roles of the submitting user (e.g. `INVESTOR`, `ENTREPRENEUR`)
        fullName:
          type: string
        nationalId:
          type: string
          description: Indonesian NIK (16 digits)
        status:
          $ref: '#/components/schemas/KycStatus'
        submittedAt:
          type: string
          format: date-time
        rejectionReason:
          type: [string, 'null']
        idCardUrl:
          type: string
          format: uri
          description: Presigned URL (5-minute TTL) for the KTP/ID card image
        selfieUrl:
          type: [string, 'null']
          format: uri
          description: Presigned URL (5-minute TTL) for the selfie image

    AdminApproveResponse:
      type: object
      required: [userId, status, reviewedAt]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPROVED]
        reviewedAt:
          type: string
          format: date-time

    AdminRejectResponse:
      type: object
      required: [userId, status, reviewedAt, rejectionReason]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REJECTED]
        reviewedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string

    AdminRevokeResponse:
      type: object
      required: [userId, status, reviewedAt, rejectionReason]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REVOKED]
        reviewedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string

    AdminProposalItem:
      type: object
      required:
        - id
        - businessName
        - category
        - requestedAmount
        - lockPeriodDays
        - status
        - entrepreneur
      properties:
        id:
          type: string
          format: uuid
        businessName:
          type: string
          example: Warung Kopi Nusantara
        category:
          type: string
          example: Kuliner
        location:
          type: [string, 'null']
          example: Yogyakarta
        requestedAmount:
          type: string
          description: Requested funding amount as a decimal string (7 decimals)
          example: "10000.0000000"
        lockPeriodDays:
          type: integer
          example: 180
        status:
          $ref: '#/components/schemas/ProposalStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
        entrepreneur:
          type: object
          required: [walletAddress]
          properties:
            walletAddress:
              type: string
              minLength: 56
              maxLength: 56
            email:
              type: [string, 'null']
              format: email

    AdminApproveProposalResponse:
      type: object
      required: [proposalId, status, campaignId]
      properties:
        proposalId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPROVED]
        campaignId:
          type: string
          format: uuid
          description: |
            The created campaign. Its on-chain contracts (ShareToken + Campaign)
            deploy asynchronously in the background — poll campaign status for progress.

    AdminRejectProposalResponse:
      type: object
      required: [proposalId, status]
      properties:
        proposalId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REJECTED]

    Proposal:
      type: object
      required:
        - id
        - businessName
        - businessDescription
        - category
        - requestedAmount
        - lockPeriodDays
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        businessName:
          type: string
          example: Warung Kopi Nusantara
        businessDescription:
          type: string
          example: Ekspansi gerai kopi UMKM di Yogyakarta dengan modal urun dana.
        category:
          type: string
          example: Kuliner
        location:
          type: [string, 'null']
          example: Yogyakarta
        requestedAmount:
          type: string
          description: Requested funding amount as a decimal string (7 decimals)
          example: "10000.0000000"
        lockPeriodDays:
          type: integer
          example: 180
        status:
          $ref: '#/components/schemas/ProposalStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the proposal is submitted (DRAFT → SUBMITTED); null while still a draft
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Campaign:
      type: object
      description: Public campaign view (list + detail).
      required: [id, goalAmount, raisedAmount, status]
      properties:
        id:
          type: string
          format: uuid
        contractAddress:
          type: [string, 'null']
          minLength: 56
          maxLength: 56
          description: Soroban Campaign contract address (C…); null until the deploy is live
        goalAmount:
          type: string
          description: Funding goal as a decimal string (7 decimals)
          example: "10000.0000000"
        raisedAmount:
          type: string
          description: Total confirmed invested so far, as a decimal string (7 decimals)
          example: "2500.0000000"
        status:
          $ref: '#/components/schemas/CampaignStatus'
        lockEndAt:
          type: [string, 'null']
          format: date-time
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        projectToken:
          type: [object, 'null']
          description: The campaign's restricted SEP-41 share token.
          properties:
            assetCode:
              type: string
              maxLength: 12
              example: WARUNGBU1234
            contractAddress:
              type: [string, 'null']
              minLength: 56
              maxLength: 56
              description: ShareToken contract address (C…); null until deployed

    PrepareInvestmentResponse:
      type: object
      required: [campaignId, xdr]
      properties:
        campaignId:
          type: string
          format: uuid
        xdr:
          type: string
          description: |
            Base64 XDR of the unsigned, prepared `invest()` transaction (investor
            as source). Sign it with the wallet and post it back to the submit endpoint.
          example: AAAAAgAAAAA...

    Investment:
      type: object
      required: [id, campaignId, amount, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        amount:
          type: string
          description: Invested USDC amount as a decimal string (7 decimals)
          example: "500.0000000"
        lpTokens:
          type: [string, 'null']
          description: Shares received (minted 1:1 with the USDC invested), as a decimal string
          example: "500.0000000"
        txHash:
          type: [string, 'null']
          minLength: 64
          maxLength: 64
          description: Hex-encoded Stellar transaction hash of the on-chain `invest()`
        status:
          $ref: '#/components/schemas/InvestmentStatus'
        investedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    Holding:
      type: object
      description: One of the caller's own current share holdings (own data, unmasked).
      required: [campaignId, balance, updatedLedger]
      properties:
        campaignId:
          type: string
          format: uuid
        balance:
          type: string
          description: Current share balance as a decimal string (7 decimals)
          example: "500.0000000"
        updatedLedger:
          type: integer
          format: int64
          description: Stellar ledger sequence at which this balance was last synced
          example: 1234567
        campaign:
          type: object
          description: Minimal campaign context for the portfolio row.
          properties:
            status:
              $ref: '#/components/schemas/CampaignStatus'
            projectToken:
              type: [object, 'null']
              properties:
                assetCode:
                  type: string
                  maxLength: 12
                  example: WARUNGBU1234

    CampaignHolding:
      type: object
      description: |
        One row of a campaign's public cap table. Holder identity is **masked**: the
        wallet address is truncated and any display name is reduced to initials. Legal
        KYC names are never exposed here.
      required: [holder, address, balance, updatedLedger]
      properties:
        holder:
          type: [string, 'null']
          description: |
            The holder's masked display name (e.g. `B*** S***`), or `null` for an
            unregistered on-chain address / a holder with no display name.
          example: B*** S***
        address:
          type: string
          description: Masked wallet address — first 4 and last 4 characters (e.g. `GCUQ…OCBY`)
          example: GCUQ…OCBY
        balance:
          type: string
          description: Current share balance as a decimal string (7 decimals)
          example: "500.0000000"
        updatedLedger:
          type: integer
          format: int64
          description: Stellar ledger sequence at which this balance was last synced
          example: 1234567

    ErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: "Both idCard and selfie files are required"
        error:
          type: string
          example: Bad Request

  responses:
    Unauthorized:
      description: Missing or invalid JWT bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Unauthorized

    Forbidden:
      description: Valid token but insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: Forbidden resource

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Not Found


# ── Paths ──────────────────────────────────────────────────────────────────────
paths:
  /auth/challenge:
    post:
      tags: [auth]
      summary: Request a challenge message
      description: |
        Returns a single-use nonce message that the client must sign with their
        Stellar secret key. The challenge expires after 300 seconds and is deleted
        after a successful login or registration (no replay).
      operationId: authChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Challenge message to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          description: Invalid wallet address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        Creates a new user account. Verifies Stellar wallet ownership via the
        signed challenge. Returns a JWT on success.

        - `role` must be `ENTREPRENEUR` or `INVESTOR`
        - `email` is **required** when `role` is `ENTREPRENEUR`
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created — JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error or invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Wallet address already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [auth]
      summary: Log in an existing user
      description: |
        Authenticates an existing user by verifying the signed challenge.
        Returns a JWT on success.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated — JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid signature or expired challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Wallet address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kyc:
    post:
      tags: [kyc]
      summary: Submit KYC
      description: |
        Submits identity verification for the authenticated user (entrepreneur
        or investor — one KYC per user). Both `idCard` and `selfie` images are
        required (JPEG or PNG, ≤ 5 MB each).

        The `nationalId` (NIK) must be unique — a second submission with an
        existing NIK returns **409**. Resubmission on a `REJECTED` profile
        overwrites the previous record (upsert on `userId`).
      operationId: kycSubmit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fullName, nationalId, idCard, selfie]
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Budi Santoso
                nationalId:
                  type: string
                  pattern: '^\d{16}$'
                  description: Indonesian NIK — exactly 16 digits
                  example: "3271010101900001"
                dateOfBirth:
                  type: string
                  format: date
                  description: Optional date of birth (YYYY-MM-DD)
                  example: "1990-01-01"
                idCard:
                  type: string
                  format: binary
                  description: KTP / ID card image (JPEG or PNG, max 5 MB)
                selfie:
                  type: string
                  format: binary
                  description: Selfie image (JPEG or PNG, max 5 MB)
      responses:
        '201':
          description: KYC submitted — status is PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmitResponse'
        '400':
          description: Missing files, wrong MIME type, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: NIK already registered to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kyc/me:
    get:
      tags: [kyc]
      summary: Get own KYC status
      description: Returns the authenticated user's current KYC profile.
      operationId: kycGetMine
      security:
        - BearerAuth: []
      responses:
        '200':
          description: KYC profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No KYC submission found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/kyc:
    get:
      tags: [admin]
      summary: List KYC submissions
      description: |
        Returns KYC submissions filtered by status. Defaults to `PENDING`.
        Each item includes presigned image URLs (5-minute TTL) for in-browser review.
      operationId: adminKycList
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/KycStatus'
          description: Filter by KYC status (default `PENDING`)
      responses:
        '200':
          description: List of KYC submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminKycItem'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/kyc/{userId}/approve:
    post:
      tags: [admin]
      summary: Approve a KYC submission
      description: |
        Transitions the user's profile from `PENDING` to `APPROVED` and enqueues an
        on-chain `ComplianceRegistry.add(wallet)` job (idempotent, retried with backoff)
        so the wallet becomes whitelisted to invest.
        Only `PENDING` profiles can be approved — any other state returns **409**.
      operationId: adminKycApprove
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the entrepreneur to approve
      responses:
        '200':
          description: KYC approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApproveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Profile is not in PENDING state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/kyc/{userId}/reject:
    post:
      tags: [admin]
      summary: Reject a KYC submission
      description: |
        Transitions the entrepreneur's profile from `PENDING` to `REJECTED`.
        The `reason` is stored and returned to the entrepreneur via `GET /kyc/me`.
        Only `PENDING` profiles can be rejected — any other state returns **409**.
      operationId: adminKycReject
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the entrepreneur to reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: KYC rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRejectResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Profile is not in PENDING state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/kyc/{userId}/revoke:
    post:
      tags: [admin]
      summary: Revoke a previously-approved KYC
      description: |
        Transitions the user's profile from `APPROVED` to `REVOKED` (expiry/sanction)
        and enqueues an on-chain `ComplianceRegistry.remove(wallet)` job, after which
        the wallet can no longer receive shares. Only `APPROVED` profiles can be
        revoked — any other state returns **409**.
      operationId: adminKycRevoke
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user whose KYC is being revoked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: KYC revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRevokeResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Profile is not in APPROVED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/proposals:
    get:
      tags: [admin]
      summary: List proposals for review
      description: |
        Returns proposals filtered by status for the admin review queue, oldest
        submission first. Defaults to `SUBMITTED`. Requires the `ADMIN` role.
      operationId: adminProposalList
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProposalStatus'
          description: Filter by proposal status (default `SUBMITTED`)
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProposalItem'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/proposals/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a proposal
      description: |
        Approves a `SUBMITTED` or `UNDER_REVIEW` proposal: records an admin review,
        transitions the proposal to `APPROVED`, creates its off-chain campaign
        mirror, and **enqueues the asynchronous on-chain deploy** of the campaign's
        ShareToken + Campaign contracts. The deploy runs in the background; the
        returned `campaignId` can be polled for live status. Requires the `ADMIN` role.

        Only a `SUBMITTED`/`UNDER_REVIEW` proposal can be approved — any other state
        returns **409**.
      operationId: adminProposalApprove
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the proposal to approve
      responses:
        '200':
          description: Proposal approved; campaign created and deploy enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApproveProposalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not in a reviewable (SUBMITTED/UNDER_REVIEW) state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/proposals/{id}/reject:
    post:
      tags: [admin]
      summary: Reject a proposal
      description: |
        Rejects a `SUBMITTED` or `UNDER_REVIEW` proposal with a reason and records an
        admin review. No campaign is created. Requires the `ADMIN` role. Only a
        `SUBMITTED`/`UNDER_REVIEW` proposal can be rejected — any other state returns **409**.
      operationId: adminProposalReject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the proposal to reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRejectProposalResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not in a reviewable (SUBMITTED/UNDER_REVIEW) state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /proposals:
    post:
      tags: [proposals]
      summary: Create a funding proposal (draft)
      description: |
        Creates a funding proposal in `DRAFT` status. Off-chain only — no on-chain
        campaign is created at this stage. Requires the `ENTREPRENEUR` role **and**
        an `APPROVED` KYC profile; otherwise returns **403**.
      operationId: proposalCreate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created in DRAFT status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          description: Validation error (e.g. requestedAmount ≤ 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [proposals]
      summary: List own proposals
      description: |
        Returns the authenticated entrepreneur's own proposals, newest first.
        Requires the `ENTREPRENEUR` role.
      operationId: proposalList
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /proposals/{id}:
    get:
      tags: [proposals]
      summary: Get one own proposal
      description: |
        Returns a single proposal owned by the authenticated entrepreneur. A
        proposal that does not exist or belongs to another user returns **404**.
      operationId: proposalGet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the proposal
      responses:
        '200':
          description: Proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [proposals]
      summary: Edit a draft proposal
      description: |
        Updates fields of the caller's proposal while it is still in `DRAFT`.
        Requires the `ENTREPRENEUR` role and an `APPROVED` KYC profile. A proposal
        that is no longer a draft returns **409**.
      operationId: proposalUpdate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProposalRequest'
      responses:
        '200':
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not a DRAFT (cannot be edited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /proposals/{id}/submit:
    post:
      tags: [proposals]
      summary: Submit a draft proposal for review
      description: |
        Transitions the caller's proposal from `DRAFT` to `SUBMITTED` and stamps
        `submittedAt`, queuing it for admin review. Requires the `ENTREPRENEUR`
        role and an `APPROVED` KYC profile. A proposal that is not a `DRAFT`
        returns **409**.
      operationId: proposalSubmit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the proposal
      responses:
        '200':
          description: Proposal submitted (status SUBMITTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not a DRAFT (cannot be submitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /campaigns:
    get:
      tags: [campaigns]
      summary: List live campaigns
      description: |
        Public, unauthenticated. Returns campaigns whose on-chain contracts are
        live (deploy complete), newest first — the investment marketplace.
      operationId: campaignList
      security: []
      responses:
        '200':
          description: Live campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'

  /campaigns/{id}:
    get:
      tags: [campaigns]
      summary: Get campaign detail
      description: |
        Public, unauthenticated. Returns a single campaign, including its on-chain
        contract + share-token addresses (needed to prepare an investment).
      operationId: campaignGet
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the campaign
      responses:
        '200':
          description: Campaign detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          $ref: '#/components/responses/NotFound'

  /campaigns/{id}/holdings:
    get:
      tags: [holdings]
      summary: Get a campaign's cap table
      description: |
        Public, unauthenticated. Returns the campaign's current share holders
        (`balance > 0`), heaviest first. Holder identity is **masked** — truncated
        wallet address + initials-only display name; legal KYC names are never
        exposed. An unknown campaign id returns **404**.
      operationId: campaignHoldings
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the campaign
      responses:
        '200':
          description: The campaign's masked cap table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignHolding'
        '404':
          $ref: '#/components/responses/NotFound'

  /campaigns/{campaignId}/investments/prepare:
    post:
      tags: [investments]
      summary: Prepare an invest() transaction
      description: |
        Builds and simulates an `invest()` transaction **sourced at the investor's
        wallet** and returns the unsigned XDR for the wallet to sign. Requires the
        `INVESTOR` role **and** an `APPROVED` KYC profile; otherwise **403**. The
        campaign must be live/active — otherwise **409**. No `Investment` row is
        created at this step.
      operationId: investmentPrepare
      security:
        - BearerAuth: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the campaign to invest in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareInvestmentRequest'
      responses:
        '200':
          description: Unsigned prepared transaction XDR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareInvestmentResponse'
        '400':
          description: Validation error (e.g. amount ≤ 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Campaign is not open for investment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /campaigns/{campaignId}/investments:
    post:
      tags: [investments]
      summary: Submit a signed invest() transaction
      description: |
        Verifies the investor-signed transaction really is this investor's
        `invest()` on this campaign, wraps it in a **platform fee-bump**, submits
        it on-chain, and — on success — records the `Investment` (`CONFIRMED`) and
        bumps the campaign's `raisedAmount` and vault balance. Idempotent on the
        transaction hash: re-submitting the same signed tx returns the existing
        `Investment` instead of duplicating it. Requires the `INVESTOR` role and an
        `APPROVED` KYC profile.
      operationId: investmentSubmit
      security:
        - BearerAuth: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitInvestmentRequest'
      responses:
        '201':
          description: Investment recorded (CONFIRMED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investment'
        '400':
          description: |
            Malformed XDR, or the tx does not match the expected `invest()` for
            this campaign/investor (wrong contract, function, investor, or amount).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Campaign is not open for investment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investments/mine:
    get:
      tags: [investments]
      summary: List own investments
      description: |
        Returns the authenticated investor's own investments, newest first.
        Requires the `INVESTOR` role.
      operationId: investmentListMine
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's investments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Investment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /holdings/mine:
    get:
      tags: [holdings]
      summary: List own share holdings
      description: |
        Returns the authenticated investor's own current share holdings
        (`balance > 0`) across all campaigns, largest first. Own data — not masked.
        Requires the `INVESTOR` role.
      operationId: holdingListMine
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's current holdings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
