          description: The campaign's milestones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Milestone'
        '401':
          $ref: '#/components/responses/Unauthorized'

