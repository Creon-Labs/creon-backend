            type: string
            format: uuid
          description: UUID of the milestone
      responses:
        '200':
          description: Milestone detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MilestoneDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /milestones/{milestoneId}/submit:
    post:
      tags: [ milestones ]
      summary: Ajukan Pencairan Milestone (Buka Voting)
      description: |
        Entrepreneur mengajukan pencairan dana ke milestone berikutnya dengan melampirkan file bukti kerja/progres.

        **Untuk Frontend Entrepreneur:**
        - Gunakan `multipart/form-data` untuk mengunggah file `proof` (Max 5MB).
        - Jika berhasil, akan membuka periode masa voting bagi investor (default 7 hari).
      operationId: milestoneSubmit
      security:
        - BearerAuth: []
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the milestone
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ proof ]
              properties:
                proof:
                  type: string
                  format: binary
                  description: Proof-of-progress file (JPEG, PNG, or PDF, max 5 MB)
      responses:
        '201':
          description: Milestone submitted (status VOTING)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Milestone'
        '400':
          description: Missing proof file, or wrong file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Milestone not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Milestone is not `PENDING` (already submitted/released), the campaign
            has not reached its funding goal, a previous milestone has not been
            released yet, or the campaign is not live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

