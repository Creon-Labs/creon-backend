      summary: Detail & Status Voting Milestone
      description: |
        Mendapatkan progres voting untuk sebuah milestone (persentase setuju/tolak, status).

        **Untuk Frontend:**
        - Menampilkan data detail termasuk link URL file bukti progres (bukti kerja) jika ada.
        - Termasuk data apakah investor yang sedang login sudah melakukan vote atau belum.
      operationId: milestoneGet
      security:
        - BearerAuth: []
      parameters:
        - name: milestoneId
          in: path
          required: true
