openapi: 3.1.0

info:
  title: Creon API
  version: 0.1.0
  description: |
    Backend API for **Creon** — a Web3 crowdfunding (urun dana) platform for
    Indonesian UMKM on Stellar/Soroban.

    ## Authentication
    All protected endpoints require a JWT bearer token obtained via
    `POST /auth/login` or `POST /auth/register`.

    ### Wallet challenge-response flow
    1. `POST /auth/challenge` → receive a nonce message
    2. Sign the message with your Stellar secret key (Ed25519)
    3. `POST /auth/register` (first time) or `POST /auth/login` with the signature

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: auth
    description: Wallet-based challenge-response authentication
  - name: kyc
    description: KYC submission and status (entrepreneurs and investors)
  - name: admin
    description: Admin review queues — KYC and funding proposals
  - name: proposals
    description: Entrepreneur funding proposals (off-chain draft → submit)
  - name: campaigns
    description: Public browsing of live campaigns (list + detail)
  - name: holdings
    description: |
      Current share-token ownership, maintained off-chain by the ownership indexer
      (polls `ShareToken` events, then writes a fresh on-chain `balance()` read into
      `TokenHolding`). Two views: an investor's own portfolio, and a campaign's
      public — but identity-masked — cap table.
  - name: investments
    description: |
      Investor funding of a live campaign in USDC.

      ### Signing flow (backend prepares, investor signs, backend submits)
      The on-chain `invest(investor, amount)` requires the investor's own
      authorization (and pulls their USDC), so the investor must sign — the
      platform key cannot invest on their behalf. The flow is:
      1. `POST /campaigns/{campaignId}/investments/prepare` → backend builds &
         simulates the `invest()` tx **with the investor as source** and returns
         the unsigned XDR.
      2. The investor signs the XDR with their wallet (e.g. Freighter).
      3. `POST /campaigns/{campaignId}/investments` → backend verifies the signed
         tx, wraps it in a **platform fee-bump** (so the investor pays no XLM
         fee), submits it, and records the `Investment`.
  - name: distributions
    description: |
      Dividend (bagi hasil) distribution + claim. The business deposits profit
      (USDC) into the campaign, the backend snapshots share ownership and posts a
      **Merkle root** on-chain, and investors claim their pro-rata entitlement —
      the contract verifies each Merkle proof, so the backend cannot forge amounts.

      Both `deposit_profit()` and `claim()` require the caller's own on-chain
      authorization, so — like invest — they use a **prepare → sign → submit**
      relay: the backend builds the unsigned XDR (caller as source), the caller's
      wallet signs it, and the backend fee-bumps + submits it. Between deposit and
      claim, a BullMQ orchestrator builds the tree and posts the root
      (`set_distribution`); the distribution is claimable once it is `COMPLETED`.
      Unclaimed dividends remain claimable indefinitely (no on-chain reclaim).
  - name: milestones
    description: |
      Milestone-based staged fund release (hybrid on-/off-chain). Entrepreneurs
      define milestones (order, title, description, amount — no dates) up front on
      the proposal; the amounts are pinned on-chain at deploy and must sum to the
      requested amount. Once a campaign is fully funded, the entrepreneur submits a
      milestone with a proof-of-progress file, which opens a weighted vote among the
      campaign's investors (weight = share balance). When the voting window closes,
      a reconcile loop tallies quorum (of a supply snapshot taken when voting
      opened) and majority of cast weight: approved → the on-chain
      `release_milestone(index)` is enqueued automatically; a missed quorum extends
      the window once and then defaults to approved. No route triggers the on-chain
      release directly — it always runs through the orchestrator once a vote settles.
  - name: refunds
    description: |
      Refunds for cancelled campaigns. When an admin cancels a problematic funded
      campaign (`POST /admin/campaigns/{id}/cancel`), the backend freezes the
      contract on-chain (`cancel()` — no further invest or milestone release),
      snapshots current share ownership, splits the **remaining custody**
      (`raised − released`) integer-floor pro-rata, and posts a **refund Merkle
      root** on-chain (`set_refund`). Investors then pull their principal with the
      same prepare → sign → submit relay as a dividend claim, calling
      `refund_claim()` — the contract verifies each Merkle proof, so the backend
      cannot forge amounts. There is no deposit step (the money is the principal
      already in custody); unclaimed refunds remain claimable indefinitely (no
      on-chain reclaim).

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Enums ──────────────────────────────────────────────────────────────────
    KycStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, REVOKED]
      description: |
        - `PENDING` – awaiting admin review
        - `APPROVED` – identity verified; the wallet is enqueued for the on-chain whitelist (`registry.add`)
        - `REJECTED` – rejected; user may resubmit
        - `REVOKED` – a previously-approved KYC was revoked (expiry/sanction); the wallet is removed from the on-chain whitelist (`registry.remove`)

    Role:
      type: string
      enum: [ENTREPRENEUR, INVESTOR, ADMIN]

    ProposalStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]
      description: |
        - `DRAFT` – created, editable, not yet submitted
        - `SUBMITTED` – submitted, awaiting admin review
        - `UNDER_REVIEW` – an admin is reviewing the proposal
        - `APPROVED` – approved by an admin; creates the campaign mirror and enqueues its on-chain deploy
        - `REJECTED` – rejected by an admin

    CampaignStatus:
      type: string
      enum: [PENDING_DEPLOYMENT, ACTIVE, LOCKED, GOAL_REACHED, COMPLETED, CANCELLED]
      description: |
        - `PENDING_DEPLOYMENT` – campaign mirror created; on-chain contracts not yet live
        - `ACTIVE` – contracts live and open for investment (funding)
        - `LOCKED` – capital locked (principal + share transfer)
        - `GOAL_REACHED` – funding goal met
        - `COMPLETED` – campaign settled
        - `CANCELLED` – admin cancelled a problematic campaign; the contract is frozen (no more invest / milestone release) and a pro-rata refund of the remaining custody is opened

    InvestmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, FAILED]
      description: |
        - `PENDING` – recorded but not yet confirmed on-chain
        - `CONFIRMED` – the `invest()` tx succeeded on-chain and shares were minted
        - `FAILED` – the investment did not complete

    DistributionStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]
      description: |
        - `PENDING` – deposit recorded; snapshot + Merkle root not yet posted
        - `COMPLETED` – tree built, claims persisted, and `set_distribution` posted on-chain (claimable)
        - `FAILED` – the orchestrator errored (retried with backoff)

    ClaimStatus:
      type: string
      enum: [PENDING, CLAIMED, FAILED]
      description: |
        - `PENDING` – entitlement computed; not yet claimed on-chain
        - `CLAIMED` – the `claim()` tx succeeded and USDC was paid to the holder
        - `FAILED` – the claim did not complete

    RefundStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]
      description: |
        - `PENDING` – campaign cancelled; the on-chain `cancel()` + snapshot + `set_refund` steps are not yet complete
        - `COMPLETED` – contract frozen, remaining custody snapshotted, claims persisted, and `set_refund` posted on-chain (claimable)
        - `FAILED` – the refund orchestrator errored (retried with backoff)

    RefundClaimStatus:
      type: string
      enum: [PENDING, CLAIMED, FAILED]
      description: |
        - `PENDING` – entitlement computed; not yet claimed on-chain
        - `CLAIMED` – the `refund_claim()` tx succeeded and the principal was returned to the holder
        - `FAILED` – the claim did not complete

    MilestoneStatus:
      type: string
      enum: [DRAFT, PENDING, VOTING, APPROVED, RELEASING, RELEASED, REJECTED, FAILED]
      description: |
        - `DRAFT` – authored on a proposal that is still a draft
        - `PENDING` – proposal approved and the milestone linked to a campaign; not yet submitted for release
        - `VOTING` – the entrepreneur submitted it; the voting window is open
        - `APPROVED` – voting passed (or defaulted after a missed-quorum extension); the on-chain release is enqueued
        - `RELEASING` – the on-chain `release_milestone()` tx is in flight
        - `RELEASED` – funds transferred to the business wallet
        - `REJECTED` – voting closed with quorum met but majority against
        - `FAILED` – the release orchestrator errored (retried with backoff)

    VoteChoice:
      type: string
      enum: [APPROVE, REJECT]

    # ── Request bodies ─────────────────────────────────────────────────────────
    ChallengeRequest:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
          description: Stellar public key (G…, 56 characters)
          example: GAHJJJKMOKYE4RVPZEWZTKH5FVI4PA3VL7GK2LFNUBSGBV3MV72CSOFA

    RegisterRequest:
      type: object
      required: [walletAddress, signature, role]
      properties:
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
          description: Stellar public key (G…, 56 characters)
          example: GAHJJJKMOKYE4RVPZEWZTKH5FVI4PA3VL7GK2LFNUBSGBV3MV72CSOFA
        signature:
          type: string
          description: Base64-encoded Ed25519 signature over the challenge message
        role:
          type: string
          enum: [ENTREPRENEUR, INVESTOR]
          description: Self-assignable role for the new account
        email:
          type: string
          format: email
          description: Required when `role` is `ENTREPRENEUR`; optional for investors
          example: founder@umkm.id
        displayName:
          type: string
          description: Optional display name
          example: Budi Santoso

    LoginRequest:
      type: object
      required: [walletAddress, signature]
      properties:
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
          example: GAHJJJKMOKYE4RVPZEWZTKH5FVI4PA3VL7GK2LFNUBSGBV3MV72CSOFA
        signature:
          type: string
          description: Base64-encoded Ed25519 signature over the challenge message

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Reason shown to the entrepreneur for re-submission
          example: NIK tidak dapat diverifikasi, mohon upload ulang KTP yang jelas.

    RevokeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the previously-approved KYC is being revoked (expiry/sanction)
          example: Wallet flagged on sanctions screening.

    CreateMilestoneRequest:
      type: object
      description: |
        One milestone in the proposal's release schedule. No dates — release is
        event-driven (the entrepreneur submits a milestone for a vote when ready),
        not calendar-based.
      required: [order, title, description, amount]
      properties:
        order:
          type: integer
          minimum: 1
          description: |
            1-based position in the release schedule. Across a proposal's
            milestones, orders must be contiguous starting at 1 (validated
            server-side). `onchainIndex` (order − 1) is derived automatically.
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Sewa & renovasi
        description:
          type: string
          minLength: 1
          maxLength: 5000
          example: Sewa tempat + renovasi gerai pertama.
        amount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: |
            This milestone's release amount as a decimal string (up to 7
            decimals, must be > 0). Across a proposal's milestones, amounts must
            sum **exactly** to `requestedAmount` — this sum is pinned on-chain at
            campaign deploy.
          example: "6000.0000000"

    CreateProposalRequest:
      type: object
      required:
        - businessName
        - businessDescription
        - category
        - requestedAmount
        - lockPeriodDays
        - milestones
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 255
          example: Warung Kopi Nusantara
        businessDescription:
          type: string
          minLength: 1
          maxLength: 5000
          example: Ekspansi gerai kopi UMKM di Yogyakarta dengan modal urun dana.
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: Kuliner
        location:
          type: string
          minLength: 1
          maxLength: 255
          example: Yogyakarta
        requestedAmount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: Requested funding amount as a decimal string (up to 7 decimals, must be > 0)
          example: "10000.0000000"
        lockPeriodDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: Capital lock period in days
          example: 180
        milestones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateMilestoneRequest'
          description: |
            The staged release schedule. Amounts must sum exactly to
            `requestedAmount`; orders must be contiguous starting at 1.
          example:
            - order: 1
              title: Sewa & renovasi
              description: Sewa tempat + renovasi gerai pertama.
              amount: "6000.0000000"
            - order: 2
              title: Peralatan & stok
              description: Mesin kopi + bahan baku awal.
              amount: "4000.0000000"

    UpdateProposalRequest:
      type: object
      description: Partial update of a DRAFT proposal; every field is optional.
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 255
          example: Warung Kopi Nusantara
        businessDescription:
          type: string
          minLength: 1
          maxLength: 5000
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: Kuliner
        location:
          type: string
          minLength: 1
          maxLength: 255
          example: Yogyakarta
        requestedAmount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: Requested funding amount as a decimal string (up to 7 decimals, must be > 0)
          example: "12500.0000000"
        lockPeriodDays:
          type: integer
          minimum: 1
          maximum: 3650
          example: 180
        milestones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateMilestoneRequest'
          description: |
            When provided, **replaces the whole milestone set** (a DRAFT proposal
            has no votes yet, so this is safe). Amounts must sum exactly to the
            effective `requestedAmount` (the new value if also provided in this
            request, otherwise the proposal's current value).

    PrepareInvestmentRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: USDC amount to invest as a decimal string (up to 7 decimals, must be > 0)
          example: "500.0000000"

    SubmitInvestmentRequest:
      type: object
      required: [signedXdr]
      properties:
        signedXdr:
          type: string
          description: |
            Base64 XDR of the investor-signed `invest()` transaction envelope
            (the XDR returned by the `prepare` endpoint, signed by the wallet).
          example: AAAAAgAAAAA...

    DepositProfitRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          description: USDC profit to deposit as a decimal string (up to 7 decimals, must be > 0)
          example: "1000.0000000"

    SubmitSignedTxRequest:
      type: object
      required: [signedXdr]
      properties:
        signedXdr:
          type: string
          description: |
            Base64 XDR of the caller-signed transaction envelope — the `deposit_profit()`
            or `claim()` XDR returned by the matching `prepare` endpoint, signed by the wallet.
          example: AAAAAgAAAAA...

    CancelCampaignRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the campaign is being cancelled — surfaced to investors alongside the refund
          example: Bisnis gagal memenuhi milestone; dana dikembalikan ke investor.

    SubmitRefundClaimRequest:
      type: object
      required: [signedXdr]
      properties:
        signedXdr:
          type: string
          description: |
            Base64 XDR of the investor-signed `refund_claim()` transaction envelope
            (the XDR returned by the `prepare` endpoint, signed by the wallet).
          example: AAAAAgAAAAA...

    # ── Responses ──────────────────────────────────────────────────────────────
    ChallengeResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Nonce string to sign with the Stellar secret key
          example: "Sign this message to authenticate with Creon: a3f8c1d2e9b7"

    TokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: JWT bearer token; payload contains `sub` (userId) and `roles`

    KycSubmitResponse:
      type: object
      required: [status, submittedAt]
      properties:
        status:
          $ref: '#/components/schemas/KycStatus'
        submittedAt:
          type: string
          format: date-time

    KycProfile:
      type: object
      required: [status, fullName, nationalId, submittedAt]
      properties:
        status:
          $ref: '#/components/schemas/KycStatus'
        fullName:
          type: string
          example: Budi Santoso
        nationalId:
          type: string
          description: Indonesian NIK (16 digits)
          example: "3271010101900001"
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        rejectionReason:
          type: [string, 'null']
          example: Foto selfie tidak jelas.

    AdminKycItem:
      type: object
      required:
        - userId
        - walletAddress
        - email
        - roles
        - fullName
        - nationalId
        - status
        - submittedAt
        - idCardUrl
      properties:
        userId:
          type: string
          format: uuid
        walletAddress:
          type: string
          minLength: 56
          maxLength: 56
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Roles of the submitting user (e.g. `INVESTOR`, `ENTREPRENEUR`)
        fullName:
          type: string
        nationalId:
          type: string
          description: Indonesian NIK (16 digits)
        status:
          $ref: '#/components/schemas/KycStatus'
        submittedAt:
          type: string
          format: date-time
        rejectionReason:
          type: [string, 'null']
        idCardUrl:
          type: string
          format: uri
          description: Presigned URL (5-minute TTL) for the KTP/ID card image
        selfieUrl:
          type: [string, 'null']
          format: uri
          description: Presigned URL (5-minute TTL) for the selfie image

    AdminApproveResponse:
      type: object
      required: [userId, status, reviewedAt]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPROVED]
        reviewedAt:
          type: string
          format: date-time

    AdminRejectResponse:
      type: object
      required: [userId, status, reviewedAt, rejectionReason]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REJECTED]
        reviewedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string

    AdminRevokeResponse:
      type: object
      required: [userId, status, reviewedAt, rejectionReason]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REVOKED]
        reviewedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string

    AdminProposalItem:
      type: object
      required:
        - id
        - businessName
        - category
        - requestedAmount
        - lockPeriodDays
        - status
        - entrepreneur
      properties:
        id:
          type: string
          format: uuid
        businessName:
          type: string
          example: Warung Kopi Nusantara
        category:
          type: string
          example: Kuliner
        location:
          type: [string, 'null']
          example: Yogyakarta
        requestedAmount:
          type: string
          description: Requested funding amount as a decimal string (7 decimals)
          example: "10000.0000000"
        lockPeriodDays:
          type: integer
          example: 180
        status:
          $ref: '#/components/schemas/ProposalStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
        entrepreneur:
          type: object
          required: [walletAddress]
          properties:
            walletAddress:
              type: string
              minLength: 56
              maxLength: 56
            email:
              type: [string, 'null']
              format: email

    AdminApproveProposalResponse:
      type: object
      required: [proposalId, status, campaignId]
      properties:
        proposalId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPROVED]
        campaignId:
          type: string
          format: uuid
          description: |
            The created campaign. Its on-chain contracts (ShareToken + Campaign)
            deploy asynchronously in the background — poll campaign status for progress.

    AdminRejectProposalResponse:
      type: object
      required: [proposalId, status]
      properties:
        proposalId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REJECTED]

    AdminCancelCampaignResponse:
      type: object
      description: |
        The refund opened by cancelling the campaign. The on-chain freeze
        (`cancel()`), the pro-rata snapshot, and posting the refund root
        (`set_refund`) all run asynchronously in the background — poll
        `GET /campaigns/{campaignId}/refund` for progress. Idempotent: re-cancelling
        returns the existing refund.
      required: [id, campaignId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        reason:
          type: [string, 'null']
          example: Bisnis gagal memenuhi milestone; dana dikembalikan ke investor.
        status:
          $ref: '#/components/schemas/RefundStatus'
        createdAt:
          type: string
          format: date-time

    Proposal:
      type: object
      required:
        - id
        - businessName
        - businessDescription
        - category
        - requestedAmount
        - lockPeriodDays
        - status
        - createdAt
        - updatedAt
        - milestones
      properties:
        id:
          type: string
          format: uuid
        businessName:
          type: string
          example: Warung Kopi Nusantara
        businessDescription:
          type: string
          example: Ekspansi gerai kopi UMKM di Yogyakarta dengan modal urun dana.
        category:
          type: string
          example: Kuliner
        location:
          type: [string, 'null']
          example: Yogyakarta
        requestedAmount:
          type: string
          description: Requested funding amount as a decimal string (7 decimals)
          example: "10000.0000000"
        lockPeriodDays:
          type: integer
          example: 180
        status:
          $ref: '#/components/schemas/ProposalStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the proposal is submitted (DRAFT → SUBMITTED); null while still a draft
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/ProposalMilestone'
          description: The proposal's staged release schedule, ordered.

    Campaign:
      type: object
      description: Public campaign view (list + detail).
      required: [id, goalAmount, raisedAmount, status]
      properties:
        id:
          type: string
          format: uuid
        contractAddress:
          type: [string, 'null']
          minLength: 56
          maxLength: 56
          description: Soroban Campaign contract address (C…); null until the deploy is live
        goalAmount:
          type: string
          description: Funding goal as a decimal string (7 decimals)
          example: "10000.0000000"
        raisedAmount:
          type: string
          description: Total confirmed invested so far, as a decimal string (7 decimals)
          example: "2500.0000000"
        status:
          $ref: '#/components/schemas/CampaignStatus'
        lockEndAt:
          type: [string, 'null']
          format: date-time
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        projectToken:
          type: [object, 'null']
          description: The campaign's restricted SEP-41 share token.
          properties:
            assetCode:
              type: string
              maxLength: 12
              example: WARUNGBU1234
            contractAddress:
              type: [string, 'null']
              minLength: 56
              maxLength: 56
              description: ShareToken contract address (C…); null until deployed

    PrepareInvestmentResponse:
      type: object
      required: [campaignId, xdr]
      properties:
        campaignId:
          type: string
          format: uuid
        xdr:
          type: string
          description: |
            Base64 XDR of the unsigned, prepared `invest()` transaction (investor
            as source). Sign it with the wallet and post it back to the submit endpoint.
          example: AAAAAgAAAAA...

    Investment:
      type: object
      required: [id, campaignId, amount, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        amount:
          type: string
          description: Invested USDC amount as a decimal string (7 decimals)
          example: "500.0000000"
        lpTokens:
          type: [string, 'null']
          description: Shares received (minted 1:1 with the USDC invested), as a decimal string
          example: "500.0000000"
        txHash:
          type: [string, 'null']
          minLength: 64
          maxLength: 64
          description: Hex-encoded Stellar transaction hash of the on-chain `invest()`
        status:
          $ref: '#/components/schemas/InvestmentStatus'
        investedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    Holding:
      type: object
      description: One of the caller's own current share holdings (own data, unmasked).
      required: [campaignId, balance, updatedLedger]
      properties:
        campaignId:
          type: string
          format: uuid
        balance:
          type: string
          description: Current share balance as a decimal string (7 decimals)
          example: "500.0000000"
        updatedLedger:
          type: integer
          format: int64
          description: Stellar ledger sequence at which this balance was last synced
          example: 1234567
        campaign:
          type: object
          description: Minimal campaign context for the portfolio row.
          properties:
            status:
              $ref: '#/components/schemas/CampaignStatus'
            projectToken:
              type: [object, 'null']
              properties:
                assetCode:
                  type: string
                  maxLength: 12
                  example: WARUNGBU1234

    CampaignHolding:
      type: object
      description: |
        One row of a campaign's public cap table. Holder identity is **masked**: the
        wallet address is truncated and any display name is reduced to initials. Legal
        KYC names are never exposed here.
      required: [holder, address, balance, updatedLedger]
      properties:
        holder:
          type: [string, 'null']
          description: |
            The holder's masked display name (e.g. `B*** S***`), or `null` for an
            unregistered on-chain address / a holder with no display name.
          example: B*** S***
        address:
          type: string
          description: Masked wallet address — first 4 and last 4 characters (e.g. `GCUQ…OCBY`)
          example: GCUQ…OCBY
        balance:
          type: string
          description: Current share balance as a decimal string (7 decimals)
          example: "500.0000000"
        updatedLedger:
          type: integer
          format: int64
          description: Stellar ledger sequence at which this balance was last synced
          example: 1234567

    PrepareDepositResponse:
      type: object
      required: [campaignId, xdr]
      properties:
        campaignId:
          type: string
          format: uuid
        xdr:
          type: string
          description: |
            Base64 XDR of the unsigned, prepared `deposit_profit()` transaction
            (business as source). Sign it with the wallet and post it back to the submit endpoint.
          example: AAAAAgAAAAA...

    PrepareClaimResponse:
      type: object
      required: [distributionId, xdr]
      properties:
        distributionId:
          type: string
          format: uuid
        xdr:
          type: string
          description: |
            Base64 XDR of the unsigned, prepared `claim()` transaction (investor as
            source). Sign it with the wallet and post it back to the submit endpoint.
          example: AAAAAgAAAAA...

    ProfitDistribution:
      type: object
      required: [id, campaignId, onchainId, totalAmount, totalClaimed, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        onchainId:
          type: integer
          description: The contract's per-campaign distribution id (`u32`), used by `set_distribution`/`claim`.
          example: 0
        totalAmount:
          type: string
          description: Profit (USDC) deposited for this distribution, as a decimal string (7 decimals)
          example: "1000.0000000"
        totalShares:
          type: [string, 'null']
          description: Total snapshotted shares across eligible holders (null until snapshotted)
          example: "1000.0000000"
        rewardPerShare:
          type: [string, 'null']
          description: Dividend per share (`totalAmount / totalShares`), as a decimal string (null until snapshotted)
          example: "1.000000000000000000"
        totalClaimed:
          type: string
          description: USDC claimed so far, as a decimal string (7 decimals)
          example: "600.0000000"
        merkleRoot:
          type: [string, 'null']
          description: Hex-encoded Merkle root posted on-chain (null until the tree is built)
        snapshotLedger:
          type: [integer, 'null']
          format: int64
          description: Stellar ledger sequence the profit was deposited at
          example: 1234567
        status:
          $ref: '#/components/schemas/DistributionStatus'
        distributedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DistributionClaim:
      type: object
      description: The caller's own entitlement for one distribution, including the Merkle proof.
      required: [id, distributionId, shareAmount, amount, merkleProof, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        distributionId:
          type: string
          format: uuid
        shareAmount:
          type: string
          description: The holder's snapshotted share balance, as a decimal string (7 decimals)
          example: "600.0000000"
        amount:
          type: string
          description: The holder's pro-rata USDC entitlement, as a decimal string (7 decimals)
          example: "600.0000000"
        leafIndex:
          type: [integer, 'null']
          description: The leaf index in the Merkle tree (also the on-chain `claim()` index)
          example: 0
        merkleProof:
          type: array
          items:
            type: string
          description: Hex-encoded sibling hashes proving the leaf against the posted root
        claimTxHash:
          type: [string, 'null']
          minLength: 64
          maxLength: 64
          description: Hex-encoded Stellar transaction hash of the on-chain `claim()`
        status:
          $ref: '#/components/schemas/ClaimStatus'
        claimedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        distribution:
          type: object
          description: Minimal parent-distribution context for the entitlement.
          properties:
            onchainId:
              type: integer
              example: 0
            campaignId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/DistributionStatus'

    Refund:
      type: object
      description: |
        A campaign's refund (at most one per campaign), opened when an admin cancels
        it. Returned by the per-campaign refund read; `null` if the campaign has not
        been cancelled.
      required: [id, campaignId, totalAmount, totalClaimed, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        reason:
          type: [string, 'null']
          description: Why the campaign was cancelled (shown to investors)
          example: Bisnis gagal memenuhi milestone; dana dikembalikan ke investor.
        totalAmount:
          type: string
          description: |
            Remaining custody (`raised − released`, read on-chain) being refunded, as
            a decimal string (7 decimals). 0 until the orchestrator snapshots the pot.
          example: "1000.0000000"
        totalShares:
          type: [string, 'null']
          description: Total snapshotted shares across eligible holders (null until snapshotted)
          example: "1000.0000000"
        totalClaimed:
          type: string
          description: Principal claimed so far, as a decimal string (7 decimals)
          example: "600.0000000"
        merkleRoot:
          type: [string, 'null']
          description: Hex-encoded refund Merkle root posted on-chain (null until the tree is built)
        snapshotLedger:
          type: [integer, 'null']
          format: int64
          description: Stellar ledger sequence the holdings snapshot was taken at
          example: 1234567
        status:
          $ref: '#/components/schemas/RefundStatus'
        createdAt:
          type: string
          format: date-time

    RefundClaim:
      type: object
      description: The caller's own refund entitlement for one cancelled campaign, including the Merkle proof.
      required: [id, refundId, shareAmount, amount, merkleProof, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        refundId:
          type: string
          format: uuid
        shareAmount:
          type: string
          description: The holder's snapshotted share balance, as a decimal string (7 decimals)
          example: "600.0000000"
        amount:
          type: string
          description: The holder's pro-rata principal entitlement, as a decimal string (7 decimals)
          example: "600.0000000"
        leafIndex:
          type: [integer, 'null']
          description: The leaf index in the Merkle tree (also the on-chain `refund_claim()` index)
          example: 0
        merkleProof:
          type: array
          items:
            type: string
          description: Hex-encoded sibling hashes proving the leaf against the posted root
        claimTxHash:
          type: [string, 'null']
          minLength: 64
          maxLength: 64
          description: Hex-encoded Stellar transaction hash of the on-chain `refund_claim()`
        status:
          $ref: '#/components/schemas/RefundClaimStatus'
        claimedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        refund:
          type: object
          description: Minimal parent-refund context for the entitlement.
          properties:
            campaignId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/RefundStatus'

    PrepareRefundClaimResponse:
      type: object
      required: [refundId, xdr]
      properties:
        refundId:
          type: string
          format: uuid
        xdr:
          type: string
          description: |
            Base64 XDR of the unsigned, prepared `refund_claim()` transaction (investor
            as source). Sign it with the wallet and post it back to the submit endpoint.
          example: AAAAAgAAAAA...

    ProposalMilestone:
      type: object
      description: A milestone as authored on / returned with a proposal (owner-only view).
      required: [id, order, onchainIndex, title, description, amount, status]
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          example: 1
        onchainIndex:
          type: integer
          description: order − 1; the index the contract's Vec<i128> constructor arg is keyed on
          example: 0
        title:
          type: string
          example: Sewa & renovasi
        description:
          type: string
          example: Sewa tempat + renovasi gerai pertama.
        amount:
          type: string
          description: This milestone's release amount as a decimal string (7 decimals)
          example: "6000.0000000"
        status:
          $ref: '#/components/schemas/MilestoneStatus'
        proofKey:
          type: [string, 'null']
          description: Object storage key of the uploaded proof-of-progress file (raw key, not a URL); set once submitted for voting
        votingStartedAt:
          type: [string, 'null']
          format: date-time
        votingEndsAt:
          type: [string, 'null']
          format: date-time
        votingExtended:
          type: boolean
          description: True once the once-only quorum-miss extension has been used
        snapshotTotalSupply:
          type: [string, 'null']
          description: Total supply snapshot (Σ TokenHolding.balance) frozen when voting opened — the quorum denominator
        releaseTxHash:
          type: [string, 'null']
          minLength: 64
          maxLength: 64
          description: Hex-encoded Stellar tx hash of the on-chain release_milestone(), once released

    Milestone:
      type: object
      description: A campaign's milestone as returned by the milestones voting endpoints.
      required: [id, campaignId, order, onchainIndex, title, description, amount, status]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        order:
          type: integer
          example: 1
        onchainIndex:
          type: integer
          description: order − 1; the index the contract's Vec<i128> constructor arg is keyed on
          example: 0
        title:
          type: string
          example: Sewa & renovasi
        description:
          type: string
          example: Sewa tempat + renovasi gerai pertama.
        amount:
          type: string
          description: This milestone's release amount as a decimal string (7 decimals)
          example: "6000.0000000"
        status:
          $ref: '#/components/schemas/MilestoneStatus'
        votingStartedAt:
          type: [string, 'null']
          format: date-time
        votingEndsAt:
          type: [string, 'null']
          format: date-time
        votingExtended:
          type: boolean
          description: True once the once-only quorum-miss extension has been used
        releaseTxHash:
          type: [string, 'null']
          minLength: 64
          maxLength: 64
          description: Hex-encoded Stellar tx hash of the on-chain release_milestone(), once released

    MilestoneTally:
      type: object
      description: Running (or final) tally of a milestone's vote, in whole-USDC-equivalent share units.
      required: [participation, approve, reject, totalSupply, quorumMet, approvalMet, quorumBps, approvalBps]
      properties:
        participation:
          type: string
          description: Total voting weight (shares) cast so far, as a decimal string
          example: "700.0000000"
        approve:
          type: string
          example: "600.0000000"
        reject:
          type: string
          example: "100.0000000"
        totalSupply:
          type: [string, 'null']
          description: Snapshotted total supply (the quorum denominator)
          example: "1000.0000000"
        quorumMet:
          type: boolean
        approvalMet:
          type: boolean
        quorumBps:
          type: integer
          description: Required participation, in basis points of total supply (MILESTONE_QUORUM_BPS)
          example: 3000
        approvalBps:
          type: integer
          description: Required approval share of cast weight, in basis points (MILESTONE_APPROVAL_BPS)
          example: 5000

    MilestoneDetail:
      description: A milestone with its running vote tally and the caller's own ballot.
      allOf:
        - $ref: '#/components/schemas/Milestone'
        - type: object
          required: [tally, myVote]
          properties:
            snapshotTotalSupply:
              type: [string, 'null']
              description: Total supply snapshot frozen when voting opened
            proofUrl:
              type: [string, 'null']
              format: uri
              description: Presigned URL (5-minute TTL) for the proof-of-progress file; null before submission
            tally:
              $ref: '#/components/schemas/MilestoneTally'
            myVote:
              type: [object, 'null']
              description: The caller's own ballot, or null if they haven't voted.
              properties:
                choice:
                  $ref: '#/components/schemas/VoteChoice'
                weight:
                  type: string
                  example: "500.0000000"
                votedAt:
                  type: string
                  format: date-time

    CastVoteRequest:
      type: object
      required: [choice]
      properties:
        choice:
          $ref: '#/components/schemas/VoteChoice'

    MilestoneVoteResponse:
      type: object
      required: [milestoneId, choice, weight]
      properties:
        milestoneId:
          type: string
          format: uuid
        choice:
          $ref: '#/components/schemas/VoteChoice'
        weight:
          type: string
          description: The voter's current share balance, as a decimal string (7 decimals)
          example: "500.0000000"

    ErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: "Both idCard and selfie files are required"
        error:
          type: string
          example: Bad Request

  responses:
    Unauthorized:
      description: Missing or invalid JWT bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Unauthorized

    Forbidden:
      description: Valid token but insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: Forbidden resource

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Not Found


# ── Paths ──────────────────────────────────────────────────────────────────────
paths:
  /auth/challenge:
    post:
      tags: [auth]
      summary: Request a challenge message
      description: |
        Returns a single-use nonce message that the client must sign with their
        Stellar secret key. The challenge expires after 300 seconds and is deleted
        after a successful login or registration (no replay).
      operationId: authChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Challenge message to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          description: Invalid wallet address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        Creates a new user account. Verifies Stellar wallet ownership via the
        signed challenge. Returns a JWT on success.

        - `role` must be `ENTREPRENEUR` or `INVESTOR`
        - `email` is **required** when `role` is `ENTREPRENEUR`
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created — JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error or invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Wallet address already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [auth]
      summary: Log in an existing user
      description: |
        Authenticates an existing user by verifying the signed challenge.
        Returns a JWT on success.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated — JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid signature or expired challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Wallet address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kyc:
    post:
      tags: [kyc]
      summary: Submit KYC
      description: |
        Submits identity verification for the authenticated user (entrepreneur
        or investor — one KYC per user). Both `idCard` and `selfie` images are
        required (JPEG or PNG, ≤ 5 MB each).

        The `nationalId` (NIK) must be unique — a second submission with an
        existing NIK returns **409**. Resubmission on a `REJECTED` profile
        overwrites the previous record (upsert on `userId`).
      operationId: kycSubmit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fullName, nationalId, idCard, selfie]
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Budi Santoso
                nationalId:
                  type: string
                  pattern: '^\d{16}$'
                  description: Indonesian NIK — exactly 16 digits
                  example: "3271010101900001"
                dateOfBirth:
                  type: string
                  format: date
                  description: Optional date of birth (YYYY-MM-DD)
                  example: "1990-01-01"
                idCard:
                  type: string
                  format: binary
                  description: KTP / ID card image (JPEG or PNG, max 5 MB)
                selfie:
                  type: string
                  format: binary
                  description: Selfie image (JPEG or PNG, max 5 MB)
      responses:
        '201':
          description: KYC submitted — status is PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmitResponse'
        '400':
          description: Missing files, wrong MIME type, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: NIK already registered to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /kyc/me:
    get:
      tags: [kyc]
      summary: Get own KYC status
      description: Returns the authenticated user's current KYC profile.
      operationId: kycGetMine
      security:
        - BearerAuth: []
      responses:
        '200':
          description: KYC profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No KYC submission found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/kyc:
    get:
      tags: [admin]
      summary: List KYC submissions
      description: |
        Returns KYC submissions filtered by status. Defaults to `PENDING`.
        Each item includes presigned image URLs (5-minute TTL) for in-browser review.
      operationId: adminKycList
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/KycStatus'
          description: Filter by KYC status (default `PENDING`)
      responses:
        '200':
          description: List of KYC submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminKycItem'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/kyc/{userId}/approve:
    post:
      tags: [admin]
      summary: Approve a KYC submission
      description: |
        Transitions the user's profile from `PENDING` to `APPROVED` and enqueues an
        on-chain `ComplianceRegistry.add(wallet)` job (idempotent, retried with backoff)
        so the wallet becomes whitelisted to invest.
        Only `PENDING` profiles can be approved — any other state returns **409**.
      operationId: adminKycApprove
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the entrepreneur to approve
      responses:
        '200':
          description: KYC approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApproveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Profile is not in PENDING state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/kyc/{userId}/reject:
    post:
      tags: [admin]
      summary: Reject a KYC submission
      description: |
        Transitions the entrepreneur's profile from `PENDING` to `REJECTED`.
        The `reason` is stored and returned to the entrepreneur via `GET /kyc/me`.
        Only `PENDING` profiles can be rejected — any other state returns **409**.
      operationId: adminKycReject
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the entrepreneur to reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: KYC rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRejectResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Profile is not in PENDING state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/kyc/{userId}/revoke:
    post:
      tags: [admin]
      summary: Revoke a previously-approved KYC
      description: |
        Transitions the user's profile from `APPROVED` to `REVOKED` (expiry/sanction)
        and enqueues an on-chain `ComplianceRegistry.remove(wallet)` job, after which
        the wallet can no longer receive shares. Only `APPROVED` profiles can be
        revoked — any other state returns **409**.
      operationId: adminKycRevoke
      security:
        - BearerAuth: []
      parameters:
        - name: userId
