        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSignedTxRequest'
      responses:
        '201':
          description: Claim recorded (CLAIMED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionClaim'
        '400':
          description: |
            Malformed XDR, or the tx does not match the expected `claim()` for this
            entitlement (wrong contract, function, id, index, claimant, or amount).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Distribution not ready, or entitlement already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /milestones:
    get:
      tags: [milestones]
      summary: List a campaign's milestones
      description: |
        Returns a campaign's milestones, ordered — for the investor voting UI.
        Any authenticated user may read.
      operationId: milestoneList
      security:
        - BearerAuth: []
      parameters:
        - name: campaignId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the campaign
      responses:
        '200':
          description: The campaign's milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Milestone'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /milestones/{milestoneId}:
    get:
      tags: [milestones]
      summary: Get milestone detail
      description: |
        Returns one milestone with its running vote tally (participation, approve/
        reject weight, quorum/approval status), a presigned URL for the
        proof-of-progress file (if submitted), and the caller's own ballot, if any.
        Any authenticated user may read.
      operationId: milestoneGet
      security:
        - BearerAuth: []
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the milestone
      responses:
        '200':
          description: Milestone detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /milestones/{milestoneId}/submit:
    post:
      tags: [milestones]
      summary: Submit a milestone for release (opens voting)
      description: |
        The entrepreneur submits a `PENDING` milestone for release, attaching a
        proof-of-progress file (JPEG, PNG, or PDF, ≤ 5 MB). Requires ownership of
        the parent proposal, the `ENTREPRENEUR` role, and an `APPROVED` KYC
        profile. Gated: the campaign must be **fully funded** (`raisedAmount >=
        goalAmount`) and every lower-order milestone must already be `RELEASED`
        (sequential release). On success the total supply is snapshotted (the
        quorum denominator) and the milestone transitions `PENDING` → `VOTING`
        with a `MILESTONE_VOTING_WINDOW_SECONDS`-long window (default 7 days).
      operationId: milestoneSubmit
      security:
        - BearerAuth: []
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the milestone
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: string
                  format: binary
                  description: Proof-of-progress file (JPEG, PNG, or PDF, max 5 MB)
      responses:
        '201':
          description: Milestone submitted (status VOTING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Milestone'
        '400':
          description: Missing proof file, or wrong file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Milestone not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Milestone is not `PENDING` (already submitted/released), the campaign
            has not reached its funding goal, a previous milestone has not been
            released yet, or the campaign is not live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /milestones/{milestoneId}/vote:
    post:
      tags: [milestones]
      summary: Cast or change a vote on a milestone
      description: |
        Investor casts (or updates) a ballot on a `VOTING` milestone, weighted by
        the caller's current share balance in the campaign. Idempotent per
        (milestone, investor) — voting again before the deadline replaces the
        previous choice and refreshes the weight. Requires the `INVESTOR` role and
        an `APPROVED` KYC profile.
      operationId: milestoneVote
      security:
        - BearerAuth: []
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastVoteRequest'
      responses:
        '200':
          description: Ballot recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneVoteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Insufficient role/KYC, or the caller holds no shares in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Voting is not open for this milestone (not VOTING, or the window has closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /campaigns/{campaignId}/refund:
    get:
      tags: [refunds]
      summary: Get a campaign's refund
      description: |
        Returns the campaign's refund (status + totals), or `null` if the campaign
        has not been cancelled. Any authenticated user may read. An unknown campaign
        id returns **404**.
      operationId: campaignRefundGet
      security:
        - BearerAuth: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the campaign
      responses:
        '200':
          description: The campaign's refund, or null if not cancelled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Refund'
                  - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /refunds/mine:
    get:
      tags: [refunds]
      summary: List own refund entitlements
      description: |
        Returns the authenticated investor's own `RefundClaim` entitlements (with
        Merkle proofs), newest first. Requires the `INVESTOR` role.
      operationId: refundListMine
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's refund entitlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundClaim'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /refunds/{refundId}/claim/prepare:
    post:
      tags: [refunds]
      summary: Prepare a refund_claim() transaction
      description: |
        Builds and simulates a `refund_claim()` transaction **sourced at the
        investor's wallet** — filling in the leaf index, wallet, amount, and Merkle
        proof from the caller's entitlement — and returns the unsigned XDR to sign.
        Requires the `INVESTOR` role and an `APPROVED` KYC profile. **404** if the
        caller has no entitlement; **409** if the refund is not yet `COMPLETED` or
        the entitlement is already claimed.
      operationId: refundClaimPrepare
      security:
        - BearerAuth: []
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the refund to claim from
      responses:
        '200':
          description: Unsigned prepared transaction XDR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareRefundClaimResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Refund not ready, or entitlement already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refunds/{refundId}/claim:
    post:
      tags: [refunds]
      summary: Submit a signed refund_claim() transaction
      description: |
        Verifies the investor-signed transaction really is this investor's
        `refund_claim()` for this entitlement (matching contract, leaf index,
        claimant, and amount), wraps it in a **platform fee-bump**, submits it, and —
        on success — marks the `RefundClaim` `CLAIMED` and bumps the refund's
        `totalClaimed`. Idempotent on the transaction hash. Requires the `INVESTOR`
        role and an `APPROVED` KYC profile.
      operationId: refundClaimSubmit
      security:
        - BearerAuth: []
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the refund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRefundClaimRequest'
      responses:
        '201':
          description: Claim recorded (CLAIMED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundClaim'
        '400':
          description: |
            Malformed XDR, or the tx does not match the expected `refund_claim()` for
            this entitlement (wrong contract, function, index, claimant, or amount).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Refund not ready, or entitlement already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
