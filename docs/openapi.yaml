      responses:
        '200':
          description: KYC revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRevokeResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Profile is not in APPROVED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/proposals:
    get:
      tags: [admin]
      summary: List proposals for review
      description: |
        Returns proposals filtered by status for the admin review queue, oldest
        submission first. Defaults to `SUBMITTED`. Requires the `ADMIN` role.
      operationId: adminProposalList
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProposalStatus'
          description: Filter by proposal status (default `SUBMITTED`)
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProposalItem'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/proposals/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a proposal
      description: |
        Approves a `SUBMITTED` or `UNDER_REVIEW` proposal: records an admin review,
        transitions the proposal to `APPROVED`, creates its off-chain campaign
        mirror, and **enqueues the asynchronous on-chain deploy** of the campaign's
        ShareToken + Campaign contracts. The deploy runs in the background; the
        returned `campaignId` can be polled for live status. Requires the `ADMIN` role.

        Only a `SUBMITTED`/`UNDER_REVIEW` proposal can be approved — any other state
        returns **409**.
      operationId: adminProposalApprove
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the proposal to approve
      responses:
        '200':
          description: Proposal approved; campaign created and deploy enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApproveProposalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not in a reviewable (SUBMITTED/UNDER_REVIEW) state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/proposals/{id}/reject:
    post:
      tags: [admin]
      summary: Reject a proposal
      description: |
        Rejects a `SUBMITTED` or `UNDER_REVIEW` proposal with a reason and records an
        admin review. No campaign is created. Requires the `ADMIN` role. Only a
        `SUBMITTED`/`UNDER_REVIEW` proposal can be rejected — any other state returns **409**.
      operationId: adminProposalReject
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the proposal to reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRejectProposalResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not in a reviewable (SUBMITTED/UNDER_REVIEW) state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/campaigns/{id}/cancel:
    post:
      tags: [admin]
      summary: Cancel a campaign and open a refund
      description: |
        Cancels a problematic **funded** campaign and opens its refund. In one
        transaction the campaign flips to `CANCELLED` and a `Refund` row (PENDING) is
        created; **after commit** the refund orchestrator is enqueued. The
        orchestrator freezes the contract on-chain (`cancel()` — `invest()` and
        `release_milestone()` then revert), snapshots current share ownership, splits
        the **remaining custody** (`raised − released`) integer-floor pro-rata, and
        posts the refund Merkle root (`set_refund`). None of that on-chain work runs
        inside the request. Requires the `ADMIN` role.

        Only a campaign that is **live on-chain** and not already terminal can be
        cancelled: an already-`CANCELLED` or `COMPLETED` campaign, or one not yet
        `LIVE`, returns **409**. Idempotent — re-cancelling returns the existing
        refund (and re-enqueues it if it stalled).
      operationId: adminCampaignCancel
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the campaign to cancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelCampaignRequest'
      responses:
        '200':
          description: Campaign cancelled; refund opened and orchestrator enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCancelCampaignResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Campaign is already cancelled/completed, or not live on-chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /proposals:
    post:
      tags: [proposals]
      summary: Create a funding proposal (draft)
      description: |
        Creates a funding proposal in `DRAFT` status. Off-chain only — no on-chain
