            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/campaigns/{id}/cancel:
    post:
      tags: [ admin ]
      summary: Batalkan Kampanye (Admin)
      description: |
        Membatalkan kampanye yang bermasalah dan memulai proses pengembalian dana (refund) ke investor.

        **Untuk Frontend Admin:**
        - Endpoint ini mengubah status kampanye jadi `CANCELLED` dan memulai proses on-chain di background.
        - Hanya bisa dipanggil jika kampanye berstatus `LIVE`.
      operationId: adminCampaignCancel
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
