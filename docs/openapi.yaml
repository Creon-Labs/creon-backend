                    properties:
                      data:
                        $ref: '#/components/schemas/AdminRejectProposalResponse'
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not in a reviewable (SUBMITTED/UNDER_REVIEW) state
