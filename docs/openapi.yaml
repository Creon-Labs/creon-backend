                      data:
                        $ref: '#/components/schemas/PrepareFaucetTrustlineResponse'
        '400':
          description: Invalid wallet address, or wallet not found on-chain (fund it via friendbot first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Wallet already has a USDC trustline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /faucet/usdc/trustline/submit:
    post:
      tags: [ faucet ]
      summary: Kirim Trustline USDC (Submit)
      description: |
        Mengirim XDR `changeTrust` yang sudah ditandatangani wallet ke blockchain
        (backend menambahkan fee-bump). **Tidak perlu login.**
      operationId: faucetTrustlineSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFaucetTrustlineRequest'
      responses:
        '201':
          description: Trustline established
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubmitFaucetTrustlineResponse'
        '400':
          description: |
            Malformed XDR, or the tx is not a changeTrust() for the platform USDC
            asset sourced by the given walletAddress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /faucet/usdc/claim:
    post:
      tags: [ faucet ]
      summary: Klaim USDC Test
      description: |
        Mengirim sejumlah USDC test (`FAUCET_USDC_AMOUNT`) langsung dari platform
        ke wallet. **Tidak perlu login, dan tidak perlu tanda tangan wallet** —
        pembayaran ditandatangani sepenuhnya oleh platform (issuer USDC ini).

        **Untuk Frontend:**
        - Wallet harus sudah punya trustline USDC (lihat `/trustline/prepare`).
        - Dibatasi cooldown per wallet (`FAUCET_CLAIM_COOLDOWN_SECONDS`, default 24 jam).
      operationId: faucetClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimFaucetRequest'
      responses:
        '201':
          description: USDC sent to the wallet
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClaimFaucetResponse'
        '400':
          description: Invalid wallet address, wallet not found on-chain, or no USDC trustline yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Wallet already claimed within the cooldown window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
