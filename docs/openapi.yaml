        - User harus memiliki role `ENTREPRENEUR` dan KYC sudah `APPROVED`.
      operationId: proposalCreate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
