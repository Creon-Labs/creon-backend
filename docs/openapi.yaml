      summary: Vote Pencairan Milestone
      description: |
        Investor memberikan suara (setuju/tolak) terhadap pencairan dana milestone.

        **Untuk Frontend Investor:**
        - Bobot suara ditentukan oleh jumlah kepemilikan saham investor di kampanye tersebut.
        - Investor bisa mengubah suara (vote ulang) selama masa voting belum ditutup.
      operationId: milestoneVote
      security:
        - BearerAuth: []
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastVoteRequest'
      responses:
        '200':
          description: Ballot recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MilestoneVoteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Insufficient role/KYC, or the caller holds no shares in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Voting is not open for this milestone (not VOTING, or the window
