[workspace]
resolver = "2"
members = [
  "compliance-registry",
  "share-token",
  "campaign",
]

# Pinned once for the whole workspace. soroban-sdk 26 matches stellar-cli 27 and the
# OpenZeppelin Stellar contracts (which require soroban-sdk ^26.1.0).
[workspace.dependencies]
soroban-sdk            = "26"
stellar-tokens         = "=0.7.2"
stellar-access         = "=0.7.2"
stellar-contract-utils = "=0.7.2"
stellar-macros         = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
